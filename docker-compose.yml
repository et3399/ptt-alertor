services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_ENDPOINT: ${REDIS_ENDPOINT:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # 内部 Docker 网络连向 scylla:8000
      DB_CONNECTION: ${DB_CONNECTION:-http://scylla:8000}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      APP_HOST: ${APP_HOST:-http://localhost:9090}
      APP_WS_HOST: ${APP_WS_HOST:-ws://localhost:9090/ws}
      S3_DOMAIN: ${S3_DOMAIN:-}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PW: ${AUTH_PW:-changeme}
      BOARD_HIGH: ${BOARD_HIGH:-Gossiping,LoL}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      MESSENGER_ACCESSTOKEN: ${MESSENGER_ACCESSTOKEN:-}
      MESSENGER_VERIFYTOKEN: ${MESSENGER_VERIFYTOKEN:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_APIKEY: ${MAILGUN_APIKEY:-}
      MAILGUN_PUBLIC_APIKEY: ${MAILGUN_PUBLIC_APIKEY:-}
    ports:
      - "9090:9090"
      - "6060:6060"
    depends_on:
      redis:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped

  scylla:
    image: scylladb/scylla:latest
    # --alternator-port=8000 开启 DynamoDB 兼容模式
    # --smp 1 --memory 768M 限制内存和 CPU，防止吃满 VPS
    command: >
      --alternator-port=8000
      --alternator-write-isolation=always
      --smp 1
      --memory 768M
    ports:
      - "4020:8000"  # 保持你原本对外的 4020 端口映射
    volumes:
      - scylla-data:/var/lib/scylla  # 数据库文件落盘持久化
    restart: unless-stopped

  dynamodb-init:
    image: amazon/aws-cli:latest
    env_file:
      - .env
    environment:
      # 内部指向 scylla 服务
      DB_CONNECTION: ${DB_CONNECTION:-http://scylla:8000}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
    depends_on:
      - scylla
    volumes:
      - ./docker/init-dynamodb.sh:/init-dynamodb.sh:ro
    entrypoint: ["/bin/bash", "/init-dynamodb.sh"]

volumes:
  redis-data:
  scylla-data:  # 新增数据库持久化卷
